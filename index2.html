<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Validation</title>
  <link rel="stylesheet" href="validate.js">
  <style>
    body { font-family: sans-serif; padding: 2rem; max-width: 400px; margin: 0 auto; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.25rem; }
    input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .error { color: #dc2626; font-size: 0.85rem; margin-top: 0.25rem; }
    button { width: 100%; padding: 0.75rem; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>Sign Up Form</h2>
  <form id="signupForm" novalidate>
    <div class="form-group">
      <label for="username">Name</label>
      <input type="text" id="username">
      <div id="nameError" class="error"></div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email">
      <div id="emailError" class="error"></div>
    </div>

    <div class="form-group">
      <label for="password">Password (min 6 chars)</label>
      <input type="password" id="password">
      <div id="passwordError" class="error"></div>
    </div>

    <button type="submit">Register</button>
  </form>

  <script src="validate.js"></script>
</body>
</html>
