<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Store</title>
  <link rel="stylesheet" href="store.css">
</head>
<body>
  <header class="store-header">
    <div class="brand">TechStore</div>
    <div class="cart-btn">Cart (0)</div>
  </header>

  <section class="banner">
    <h1>Summer Tech Sale</h1>
    <p>Up to 40% off top electronics. Limited time only!</p>
    <button class="shop-btn">Shop Now</button>
  </section>

  <main class="container">
    <h2>Featured Products</h2>
    <!-- Question 5: CSS Grid layout -->
    <div class="product-grid">
      <article class="product-card">
        <div class="img-placeholder">Headphones</div>
        <h3>Wireless Headphones</h3>
        <p class="price">$99.99</p>
        <button class="add-btn">Add to Cart</button>
      </article>

      <article class="product-card">
        <div class="img-placeholder">Smartwatch</div>
        <h3>Fitness Smartwatch</h3>
        <p class="price">$149.99</p>
        <button class="add-btn">Add to Cart</button>
      </article>

      <article class="product-card">
        <div class="img-placeholder">Speaker</div>
        <h3>Bluetooth Speaker</h3>
        <p class="price">$49.99</p>
        <button class="add-btn">Add to Cart</button>
      </article>

      <article class="product-card">
        <div class="img-placeholder">Keyboard</div>
        <h3>Mechanical Keyboard</h3>
        <p class="price">$79.99</p>
        <button class="add-btn">Add to Cart</button>
      </article>
    </div>
  </main>
</body>
</html>
